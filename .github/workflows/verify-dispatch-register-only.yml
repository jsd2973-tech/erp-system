name: Verify dispatch register only flow

on:
  push:
    branches:
      - fix/priority5-auth-bid-date

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/priority5-auth-bid-date
      - name: Apply register-only navigation fix
        run: python scripts/fix_dispatch_register_only_navigation.py
      - name: Install dependencies
        run: npm ci
      - name: TypeScript and build
        run: npm run build
      - name: Verify register-only guard
        run: grep -q 'if (allowedViews.includes("dispatch_list")) onNavigate("dispatch_list");' src/features/dispatch/DispatchPage.tsx
      - name: Commit verified source change
        run: |
          if git diff --quiet -- src/features/dispatch/DispatchPage.tsx; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/dispatch/DispatchPage.tsx
          git commit -m "fix: keep register-only users on allowed dispatch view"
          git push origin HEAD:fix/priority5-auth-bid-date
