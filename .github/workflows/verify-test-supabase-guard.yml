name: Verify test Supabase guard

on:
  push:
    branches:
      - fix/priority5-auth-bid-date

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/priority5-auth-bid-date
      - run: npm ci
      - run: npm run build
      - name: Verify production URL guard
        run: |
          grep -q '테스트 Supabase 모드에서는 운영 Supabase URL을 사용할 수 없습니다' src/supabaseClient.ts
          grep -q 'isSupabaseTestMode ? String(import.meta.env.VITE_TEST_ADMIN_EMAIL' src/App.tsx
