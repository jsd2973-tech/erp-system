name: Verify dispatch permission alignment

on:
  push:
    branches:
      - fix/priority5-auth-bid-date

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/priority5-auth-bid-date

      - name: Apply UI auth-link patch
        run: python scripts/finalize_dispatch_auth_link_ui.py

      - name: Install dependencies
        run: npm ci

      - name: TypeScript and build
        run: npm run build

      - name: Verify guards
        run: |
          grep -q "has_dispatch_permission('dispatch_register')" supabase/dispatch_office_editor_rls_review.sql
          grep -q "deleted_at is not null" supabase/dispatch_office_editor_rls_review.sql
          grep -q "guard_dispatch_driver_auth_user_id" supabase/dispatch_office_editor_rls_review.sql
          grep -q "canManageAuthUserId={isAdmin}" src/features/dispatch/DispatchPage.tsx
          grep -q "관리자만 변경 가능" src/features/dispatch/DriverManagement.tsx

      - name: Commit verified source change
        run: |
          if git diff --quiet -- src/features/dispatch/DispatchPage.tsx; then
            echo "No DispatchPage change needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/dispatch/DispatchPage.tsx
          git commit -m "fix: preserve driver auth link for non-admin editors"
          git push origin HEAD:fix/priority5-auth-bid-date
