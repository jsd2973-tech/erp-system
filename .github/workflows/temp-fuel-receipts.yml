name: temp-fuel-receipts
on:
  push:
    branches: [feature/fuel-receipts-20260915]
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/fuel-receipts-20260915
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Apply receipt patch
        run: python3 scripts/fix_fuel_import_without_site.py
      - name: Build
        run: npm ci && npm run build
      - name: Commit generated source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/fuel/FuelManagement.tsx
          git commit -m "feat: fold fuel receipt UI into source [skip ci]" || true
          git push origin feature/fuel-receipts-20260915
