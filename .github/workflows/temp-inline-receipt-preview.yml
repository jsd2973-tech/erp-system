name: temp-inline-receipt-preview
on:
  push:
    branches: [fix/fuel-receipt-inline-preview-20260915]
permissions:
  contents: write
jobs:
  patch:
    if: github.event.head_commit.message == 'chore: run inline receipt preview patch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/fuel-receipt-inline-preview-20260915
      - run: python3 scripts/temp_inline_receipt_preview.py
      - run: npm ci && npm run build
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/fuel/FuelManagement.tsx src/features/fuel/fuelManagement.css scripts/fix_fuel_import_without_site.py
          git commit -m "fix: preview fuel receipts inline [skip ci]"
          git push origin fix/fuel-receipt-inline-preview-20260915
