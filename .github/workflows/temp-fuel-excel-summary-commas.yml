name: Temp fuel Excel summary commas
on:
  push:
    branches:
      - fix/fuel-excel-summary-commas-20260914
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/fuel-excel-summary-commas-20260914
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply changes
        run: python3 scripts/fix_fuel_excel_summary_commas.py
      - name: Build
        run: npm ci && npm run build
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/fuel/FuelManagement.tsx
          git commit -m "fix: format fuel Excel summary numbers with commas [skip ci]"
          git push origin HEAD:fix/fuel-excel-summary-commas-20260914
