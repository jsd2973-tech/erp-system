name: Verify priority auth and bid date

on:
  push:
    branches:
      - fix/priority5-auth-bid-date
    paths:
      - .github/workflows/verify-priority5-auth-bid.yml

permissions:
  contents: write

jobs:
  patch-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/priority5-auth-bid-date
          fetch-depth: 0

      - name: Patch bid date rollover to Korea time
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/App.tsx')
          s = p.read_text(encoding='utf-8')

          old = '''const toBidDateInput = (date: Date) => {
            const year = date.getFullYear();
            const month = String(date.getMonth() + 1).padStart(2, "0");
            const day = String(date.getDate()).padStart(2, "0");
            return `${year}-${month}-${day}`;
          };

          const getBidQuickRange = (days: number) => {
            const to = new Date();
            const from = new Date(to);
            from.setDate(from.getDate() - Math.max(0, days - 1));
            return { from: toBidDateInput(from), to: toBidDateInput(to) };
          };'''.replace('          ', '')
          new = '''const BID_FOLLOW_TODAY_KEY = "erp_bid_follow_today_v1";

          const toBidDateInput = (date: Date) => {
            const parts = new Intl.DateTimeFormat("en-CA", {
              timeZone: "Asia/Seoul",
              year: "numeric",
              month: "2-digit",
              day: "2-digit",
            }).formatToParts(date);
            const part = (type: string) => parts.find((item) => item.type === type)?.value || "";
            return `${part("year")}-${part("month")}-${part("day")}`;
          };

          const getBidQuickRange = (days: number) => {
            const toKey = toBidDateInput(new Date());
            const to = new Date(`${toKey}T00:00:00+09:00`);
            const from = new Date(to.getTime() - Math.max(0, days - 1) * 86400000);
            return { from: toBidDateInput(from), to: toKey };
          };'''.replace('          ', '')
          if old not in s:
              raise SystemExit('bid date helper pattern not found')
          s = s.replace(old, new, 1)

          old = '''  const [bidFetchedAt, setBidFetchedAt] = useState("");
          const [bidFilters, setBidFilters] = useState<{ region: BidRegionFilter; from: string; to: string }>(() => {'''.replace('          ', '')
          new = '''  const [bidFetchedAt, setBidFetchedAt] = useState("");
          const [bidFollowToday, setBidFollowToday] = useState(() => window.localStorage.getItem(BID_FOLLOW_TODAY_KEY) !== "0");
          const [bidFilters, setBidFilters] = useState<{ region: BidRegionFilter; from: string; to: string }>(() => {'''.replace('          ', '')
          if old not in s:
              raise SystemExit('bid filter state pattern not found')
          s = s.replace(old, new, 1)

          old = '''  useEffect(() => {
            window.localStorage.setItem("erp_bid_filter_settings_v1", JSON.stringify(bidFilters));
          }, [bidFilters]);

          const setQuickRange = (days: number) => {
            setBidFilters((current) => ({ ...current, ...getBidQuickRange(days) }));
          };'''.replace('          ', '')
          new = '''  useEffect(() => {
            window.localStorage.setItem("erp_bid_filter_settings_v1", JSON.stringify(bidFilters));
          }, [bidFilters]);

          useEffect(() => {
            if (!bidFollowToday) return;

            const syncBidRangeToKoreaToday = () => {
              const today = toBidDateInput(new Date());
              setBidFilters((current) => {
                if (current.to === today) return current;
                const fromTime = new Date(`${current.from}T00:00:00+09:00`).getTime();
                const toTime = new Date(`${current.to}T00:00:00+09:00`).getTime();
                const rangeDays = Number.isFinite(fromTime) && Number.isFinite(toTime)
                  ? Math.min(90, Math.max(1, Math.round((toTime - fromTime) / 86400000) + 1))
                  : 30;
                return { ...current, ...getBidQuickRange(rangeDays) };
              });
            };

            syncBidRangeToKoreaToday();
            const timer = window.setInterval(syncBidRangeToKoreaToday, 10000);
            window.addEventListener("focus", syncBidRangeToKoreaToday);
            document.addEventListener("visibilitychange", syncBidRangeToKoreaToday);
            return () => {
              window.clearInterval(timer);
              window.removeEventListener("focus", syncBidRangeToKoreaToday);
              document.removeEventListener("visibilitychange", syncBidRangeToKoreaToday);
            };
          }, [bidFollowToday]);

          const setQuickRange = (days: number) => {
            setBidFollowToday(true);
            window.localStorage.setItem(BID_FOLLOW_TODAY_KEY, "1");
            setBidFilters((current) => ({ ...current, ...getBidQuickRange(days) }));
          };

          const setBidDateManually = (key: "from" | "to", value: string) => {
            setBidFollowToday(false);
            window.localStorage.setItem(BID_FOLLOW_TODAY_KEY, "0");
            setBidFilters((current) => ({ ...current, [key]: value }));
          };'''.replace('          ', '')
          if old not in s:
              raise SystemExit('bid effects pattern not found')
          s = s.replace(old, new, 1)

          old = '''            <input type="date" value={bidFilters.from} max={bidFilters.to} onChange={(event) => setBidFilters((current) => ({ ...current, from: event.target.value }))} aria-label="입찰공고 조회 시작일" />
            <span>~</span>
            <input type="date" value={bidFilters.to} min={bidFilters.from} max={toBidDateInput(new Date())} onChange={(event) => setBidFilters((current) => ({ ...current, to: event.target.value }))} aria-label="입찰공고 조회 종료일" />'''.replace('          ', '')
          new = '''            <input type="date" value={bidFilters.from} max={bidFilters.to} onChange={(event) => setBidDateManually("from", event.target.value)} aria-label="입찰공고 조회 시작일" />
            <span>~</span>
            <input type="date" value={bidFilters.to} min={bidFilters.from} max={toBidDateInput(new Date())} onChange={(event) => setBidDateManually("to", event.target.value)} aria-label="입찰공고 조회 종료일" />'''.replace('          ', '')
          if old not in s:
              raise SystemExit('bid date inputs pattern not found')
          s = s.replace(old, new, 1)

          p.write_text(s, encoding='utf-8')
          PY

      - name: Install dependencies
        run: npm ci

      - name: TypeScript and production build
        run: npm run build

      - name: Verify plaintext password key is not used
        run: |
          if grep -R "erp_login_auto_password_v1" src/AuthEntry.tsx | grep -v "LEGACY_AUTH_AUTO_PASSWORD_KEY"; then
            echo "Unexpected plaintext password storage reference remains"
            exit 1
          fi
          if grep -n "setItem(LEGACY_AUTH_AUTO_PASSWORD_KEY" src/AuthEntry.tsx; then
            echo "Legacy password key is still written"
            exit 1
          fi
          grep -n 'timeZone: "Asia/Seoul"' src/App.tsx
          grep -n 'setInterval(syncBidRangeToKoreaToday, 10000)' src/App.tsx

      - name: Commit branch-only patch
        run: |
          if git diff --quiet -- src/App.tsx; then
            echo "No App.tsx change needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx
          git commit -m "fix: roll bid latest date by Korea time"
          git push origin HEAD:fix/priority5-auth-bid-date
