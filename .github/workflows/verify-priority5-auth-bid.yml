name: Verify priority auth and bid date

on:
  push:
    branches:
      - fix/priority5-auth-bid-date
    paths:
      - .github/workflows/verify-priority5-auth-bid.yml

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/priority5-auth-bid-date
          fetch-depth: 0
      - name: Apply branch-only bid date patch
        run: python scripts/patch_bid_korea_date.py
      - name: Install dependencies
        run: npm ci
      - name: TypeScript and build
        run: npm run build
      - name: Verify guards
        run: |
          test "$(grep -c 'setItem(LEGACY_AUTH_AUTO_PASSWORD_KEY' src/AuthEntry.tsx)" -eq 0
          grep -q 'localStorage.removeItem(LEGACY_AUTH_AUTO_PASSWORD_KEY)' src/AuthEntry.tsx
          grep -q 'timeZone: "Asia/Seoul"' src/App.tsx
          grep -q 'setInterval(syncBidRangeToKoreaToday, 10000)' src/App.tsx
          grep -q 'setBidDateManually("to"' src/App.tsx
      - name: Commit branch-only source patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx
          if git diff --cached --quiet; then
            echo "No source change needed"
          else
            git commit -m "fix: roll bid latest date by Korea time"
            git push origin HEAD:fix/priority5-auth-bid-date
          fi
