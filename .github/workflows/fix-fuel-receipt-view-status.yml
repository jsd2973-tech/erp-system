name: fix-fuel-receipt-view-status
on:
  push:
    branches:
      - fix/fuel-receipt-view-status-20260915
permissions:
  contents: write
jobs:
  patch:
    if: github.event.head_commit.message == 'chore: rerun fuel receipt view fix'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/fuel-receipt-view-status-20260915
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Apply patch
        run: python3 scripts/temp_fix_fuel_receipt_view.py
      - name: Verify build
        run: npm ci && npm run build
      - name: Commit generated source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/fuel/FuelManagement.tsx src/features/fuel/fuelManagement.css
          git commit -m "fix: make fuel receipts visible and viewable"
          git push origin fix/fuel-receipt-view-status-20260915
