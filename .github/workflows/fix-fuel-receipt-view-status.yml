name: fix-fuel-receipt-view-status
on:
  push:
    branches: [fix/fuel-receipt-view-status-20260915]
permissions:
  contents: write
jobs:
  patch:
    if: github.event.head_commit.message == 'chore: apply fuel receipt view fix'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/fuel-receipt-view-status-20260915
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Patch receipt view and status UI
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/features/fuel/FuelManagement.tsx')
          s = p.read_text()

          old = '''  const viewReceipt = async () => {
            if (!receiptTarget?.receipt_path) return;
            setReceiptBusy(true); setError("");
            const { data, error: signedError } = await supabase.storage.from("fuel-receipts").createSignedUrl(receiptTarget.receipt_path, 300);
            setReceiptBusy(false);
            if (signedError || !data?.signedUrl) { setError(`영수증을 열지 못했습니다. (${signedError?.message || "signed URL 생성 실패"})`); return; }
            window.open(data.signedUrl, "_blank", "noopener,noreferrer");
          };'''
          new = '''  const viewReceipt = async () => {
            if (!receiptTarget?.receipt_path) return;
            const receiptWindow = window.open("about:blank", "_blank");
            if (!receiptWindow) {
              setError("브라우저에서 새 창이 차단되었습니다. 이 사이트의 팝업을 허용한 뒤 다시 눌러주세요.");
              return;
            }
            receiptWindow.opener = null;
            receiptWindow.document.title = "영수증 불러오는 중";
            receiptWindow.document.body.innerHTML = '<p style="font-family:sans-serif;padding:24px">영수증을 불러오는 중입니다...</p>';
            setReceiptBusy(true); setError("");
            const { data, error: signedError } = await supabase.storage.from("fuel-receipts").createSignedUrl(receiptTarget.receipt_path, 300);
            setReceiptBusy(false);
            if (signedError || !data?.signedUrl) {
              receiptWindow.close();
              setError(`영수증을 열지 못했습니다. (${signedError?.message || "signed URL 생성 실패"})`);
              return;
            }
            receiptWindow.location.href = data.signedUrl;
          };'''
          if old not in s:
              raise SystemExit('viewReceipt anchor not found')
          s = s.replace(old, new, 1)

          old = '<table className="fuel-table"><thead><tr><th>일자</th><th>현장</th><th>유종</th><th>차량/장비번호</th><th>횟수</th><th>수량</th><th>단가</th><th>공급가액</th><th>부가세</th><th>합계금액</th><th>주유처</th><th></th></tr></thead><tbody>'
          new = '<table className="fuel-table"><thead><tr><th>일자</th><th>현장</th><th>유종</th><th>차량/장비번호</th><th>횟수</th><th>수량</th><th>단가</th><th>공급가액</th><th>부가세</th><th>합계금액</th><th>주유처</th><th>영수증</th><th></th></tr></thead><tbody>'
          if old not in s:
              raise SystemExit('main table header anchor not found')
          s = s.replace(old, new, 1)
          s = s.replace('<tr><td colSpan={12} className="fuel-empty-cell">', '<tr><td colSpan={13} className="fuel-empty-cell">', 1)

          old = '<td>{record.station_name}</td><td><div className="fuel-row-actions"><button className="fuel-icon-button" type="button" title={record.receipt_path ? "영수증 보기/교체" : "영수증 첨부"} onClick={() => setReceiptTarget({ ...record })}><Paperclip size={15} /></button><button className="fuel-icon-button" type="button" title="수정" onClick={() => setEditingRecord({ ...record })}><Pencil size={15} /></button><button className="fuel-icon-button" type="button" title="삭제" onClick={() => void removeRecord(record)}><Trash2 size={15} /></button></div></td>'
          new = '<td>{record.station_name}</td><td><button className={`fuel-receipt-state ${record.receipt_path ? "is-attached" : ""}`} type="button" onClick={() => setReceiptTarget({ ...record })}><Paperclip size={13} /> {record.receipt_path ? "첨부됨" : "미첨부"}</button></td><td><div className="fuel-row-actions"><button className="fuel-icon-button" type="button" title="수정" onClick={() => setEditingRecord({ ...record })}><Pencil size={15} /></button><button className="fuel-icon-button" type="button" title="삭제" onClick={() => void removeRecord(record)}><Trash2 size={15} /></button></div></td>'
          if old not in s:
              raise SystemExit('main row anchor not found')
          s = s.replace(old, new, 1)

          old = '<div><span>수량 <strong>{number(record.quantity)} L</strong></span><span>단가 <strong>{money(record.unit_price)}원</strong></span><span>횟수 <strong>{record.usage_count}회</strong></span><span>합계 <strong>{money(record.total_amount)}원</strong></span></div>'
          new = '<div><span>수량 <strong>{number(record.quantity)} L</strong></span><span>단가 <strong>{money(record.unit_price)}원</strong></span><span>횟수 <strong>{record.usage_count}회</strong></span><span>합계 <strong>{money(record.total_amount)}원</strong></span><span>영수증 <strong className={record.receipt_path ? "fuel-receipt-mobile-attached" : ""}>{record.receipt_path ? "첨부됨" : "미첨부"}</strong></span></div>'
          if s.count(old) < 2:
              raise SystemExit('mobile summary anchors not found')
          s = s.replace(old, new, 1)
          s = s.replace(old, new, 1)

          old = '<button type="button" onClick={() => setReceiptTarget({ ...record })}><Paperclip size={14} /> {record.receipt_path ? "영수증" : "첨부"}</button>'
          new = '<button type="button" onClick={() => setReceiptTarget({ ...record })}><Paperclip size={14} /> {record.receipt_path ? "영수증 보기" : "영수증 첨부"}</button>'
          s = s.replace(old, new)

          old = '<td><button className="fuel-icon-button" type="button" title={record.receipt_path ? "영수증 보기/교체" : "영수증 첨부"} onClick={() => setReceiptTarget({ ...record })}><Paperclip size={15} /></button></td>'
          new = '<td><button className={`fuel-receipt-state ${record.receipt_path ? "is-attached" : ""}`} type="button" onClick={() => setReceiptTarget({ ...record })}><Paperclip size={13} /> {record.receipt_path ? "첨부됨" : "미첨부"}</button></td>'
          if old not in s:
              raise SystemExit('detail status anchor not found')
          s = s.replace(old, new, 1)
          p.write_text(s)

          css = Path('src/features/fuel/fuelManagement.css')
          c = css.read_text()
          addition = '''
          .fuel-receipt-state{display:inline-flex;align-items:center;gap:4px;border:1px solid #e2e8f0;background:#f8fafc;color:#64748b;border-radius:999px;padding:5px 8px;font-size:11px;font-weight:800;cursor:pointer;white-space:nowrap}.fuel-receipt-state.is-attached{border-color:#99f6e4;background:#f0fdfa;color:#0f766e}.fuel-receipt-state:hover{border-color:#94a3b8}.fuel-receipt-mobile-attached{color:#0f766e!important}
          '''
          if '.fuel-receipt-state{' not in c:
              c += addition
          css.write_text(c)
          PY
      - name: Build
        run: npm ci && npm run build
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/fuel/FuelManagement.tsx src/features/fuel/fuelManagement.css
          git commit -m "fix: make fuel receipts visible and viewable" || exit 0
          git push origin fix/fuel-receipt-view-status-20260915
