name: Temporary fuel download and quick entry
on:
  push:
    branches: [feat/fuel-download-quick-entry-20260914]
permissions:
  contents: write
jobs:
  enhance:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/fuel-download-quick-entry-20260914
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Enhance fuel management
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/features/fuel/FuelManagement.tsx')
          s = p.read_text()
          def rep(old, new, label, count=1):
              global s
              if old not in s:
                  raise SystemExit(f'{label} anchor not found')
              s = s.replace(old, new, count)

          rep('import { FileSpreadsheet, Fuel, Plus, RefreshCcw, Search, Trash2, Upload } from "lucide-react";',
              'import { Download, FileSpreadsheet, Fuel, Plus, RefreshCcw, Search, Trash2, Upload } from "lucide-react";',
              'download icon')

          rep('  const [records, setRecords] = useState<FuelRecord[]>([]);\n  const [loading, setLoading] = useState(true);',
              '  const [records, setRecords] = useState<FuelRecord[]>([]);\n  const [referenceRecords, setReferenceRecords] = useState<FuelRecord[]>([]);\n  const [loading, setLoading] = useState(true);',
              'reference state')

          rep('  useEffect(() => { void load(); }, [month]);\n\n  const sites = useMemo',
              '''  useEffect(() => { void load(); }, [month]);
  useEffect(() => {
    const loadReferences = async () => {
      const { data } = await supabase.from("fuel_records")
        .select("fuel_date,site_name,product_name,vehicle_number,unit_price,station_name,quantity,total_amount,usage_count,line_amount,supply_amount,vat_amount,id")
        .order("fuel_date", { ascending: false })
        .limit(2000);
      if (data) setReferenceRecords(data as FuelRecord[]);
    };
    void loadReferences();
  }, [supabase]);

  const sites = useMemo''',
              'reference loader')

          rep('  const siteSummary = useMemo(() => summarize("site_name"), [filtered]);\n\n  const onFile = async',
              '''  const siteSummary = useMemo(() => summarize("site_name"), [filtered]);

  const vehicleProfiles = useMemo(() => {
    const map = new Map<string, FuelRecord>();
    referenceRecords.forEach((record) => {
      const key = String(record.vehicle_number || "").trim();
      if (key && !map.has(key)) map.set(key, record);
    });
    return [...map.entries()].sort((a, b) => natural(a[0], b[0]));
  }, [referenceRecords]);
  const vehicleOptions = useMemo(() => vehicleProfiles.map(([vehicle]) => vehicle), [vehicleProfiles]);
  const allSites = useMemo(() => [...new Set(referenceRecords.map((record) => String(record.site_name || "")).filter(Boolean))].sort(natural), [referenceRecords]);
  const allProducts = useMemo(() => [...new Set(referenceRecords.map((record) => String(record.product_name || "")).filter(Boolean))].sort(natural), [referenceRecords]);

  const applyVehicleProfile = (vehicle: string) => {
    const profile = vehicleProfiles.find(([name]) => name === vehicle)?.[1];
    setManual((current) => ({
      ...current,
      vehicle_number: vehicle,
      site_name: profile?.site_name || current.site_name,
      product_name: profile?.product_name || current.product_name,
      unit_price: profile?.unit_price ? String(profile.unit_price) : current.unit_price,
      station_name: profile?.station_name || current.station_name,
    }));
  };

  const exportGeneralExcel = () => {
    if (!filtered.length) return setError("다운로드할 유류내역이 없습니다.");
    const rows = filtered.map((record) => ({
      일자: record.fuel_date, 현장: record.site_name, 유종: record.product_name, "차량/장비번호": record.vehicle_number,
      횟수: record.usage_count, "수량(L)": record.quantity, "단가(원/L)": record.unit_price,
      공급가액: record.supply_amount, 부가세: record.vat_amount, 합계금액: record.total_amount,
      주유처: record.station_name, 메모: record.memo || "",
    }));
    const ws = XLSX.utils.json_to_sheet(rows);
    ws["!cols"] = [12, 14, 12, 18, 8, 11, 13, 14, 12, 14, 20, 20].map((wch) => ({ wch }));
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, "유류내역");
    XLSX.writeFile(wb, `유류내역_${month}.xlsx`);
  };

  const exportStatementExcel = () => {
    if (!filtered.length) return setError("다운로드할 유류내역이 없습니다.");
    const ordered = [...filtered].sort((a, b) => natural(a.site_name, b.site_name) || natural(a.product_name, b.product_name) || natural(a.vehicle_number, b.vehicle_number) || a.fuel_date.localeCompare(b.fuel_date));
    const title = `${month.replace("-", "년 ")}월 유류 거래명세서`;
    const header = ["현장명", "제품명/규격", "차량번호", "일자", "횟수", "수량", "단가(원/대)", "단가(원/단위)", "공급가액", "부가세", "합계금액"];
    const body = ordered.map((record) => [record.site_name, record.product_name, record.vehicle_number, record.fuel_date, record.usage_count, record.quantity, record.line_amount, record.unit_price, record.supply_amount, record.vat_amount, record.total_amount]);
    const sums = ordered.reduce((acc, record) => ({ count: acc.count + record.usage_count, qty: acc.qty + record.quantity, supply: acc.supply + record.supply_amount, vat: acc.vat + record.vat_amount, total: acc.total + record.total_amount }), { count: 0, qty: 0, supply: 0, vat: 0, total: 0 });
    const aoa = [[title], ["주유처", ordered[0]?.station_name || ""], ["조회기간", `${month}-01 ~ ${monthBounds(month).to}`], [], header, ...body, ["합계", "", "", "", sums.count, sums.qty, "", "", sums.supply, sums.vat, sums.total]];
    const ws = XLSX.utils.aoa_to_sheet(aoa);
    ws["!merges"] = [{ s: { r: 0, c: 0 }, e: { r: 0, c: 10 } }];
    ws["!cols"] = [16, 16, 18, 13, 9, 11, 14, 15, 14, 12, 14].map((wch) => ({ wch }));
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, "거래명세서");
    XLSX.writeFile(wb, `유류거래명세서_${month}.xlsx`);
  };

  const onFile = async''',
              'profiles and exports')

          rep('        <button type="button" onClick={() => fileInput.current?.click()}><Upload size={16} /> 명세서 가져오기</button>\n        <button type="button" onClick={() => setManualOpen((value) => !value)}><Plus size={16} /> 직접 입력</button>',
              '''        <button type="button" onClick={() => fileInput.current?.click()}><Upload size={16} /> 명세서 가져오기</button>
        <button type="button" onClick={exportStatementExcel}><Download size={16} /> 명세서 엑셀</button>
        <button type="button" onClick={exportGeneralExcel}><Download size={16} /> 목록 엑셀</button>
        <button type="button" onClick={() => setManualOpen((value) => !value)}><Plus size={16} /> 직접 입력</button>''',
              'header export buttons')

          rep('''        <label><span>현장</span><input value={manual.site_name} onChange={(event) => setManual({ ...manual, site_name: event.target.value })} placeholder="공장" /></label>
        <label><span>유종</span><input value={manual.product_name} onChange={(event) => setManual({ ...manual, product_name: event.target.value })} placeholder="경유" /></label>
        <label><span>차량/장비번호 *</span><input value={manual.vehicle_number} onChange={(event) => setManual({ ...manual, vehicle_number: event.target.value })} placeholder="세종03가1166" /></label>''',
              '''        <label><span>현장</span><input list="fuel-site-options" value={manual.site_name} onChange={(event) => setManual({ ...manual, site_name: event.target.value })} placeholder="공장" /><datalist id="fuel-site-options">{allSites.map((name) => <option key={name} value={name} />)}</datalist></label>
        <label><span>유종</span><input list="fuel-product-options" value={manual.product_name} onChange={(event) => setManual({ ...manual, product_name: event.target.value })} placeholder="경유" /><datalist id="fuel-product-options">{allProducts.map((name) => <option key={name} value={name} />)}</datalist></label>
        <label className="fuel-vehicle-entry"><span>차량/장비번호 *</span><input list="fuel-vehicle-options" value={manual.vehicle_number} onChange={(event) => { const value = event.target.value; setManual({ ...manual, vehicle_number: value }); if (vehicleOptions.includes(value)) applyVehicleProfile(value); }} onBlur={() => { if (vehicleOptions.includes(manual.vehicle_number)) applyVehicleProfile(manual.vehicle_number); }} placeholder="번호 입력 또는 선택" /><datalist id="fuel-vehicle-options">{vehicleOptions.map((name) => <option key={name} value={name} />)}</datalist></label>''',
              'manual datalists')

          rep('''      </div>
      <div className="fuel-manual-total"><span>예상 합계</span>''',
              '''      </div>
      {vehicleOptions.length > 0 && <div className="fuel-quick-vehicles"><span>차량·장비 빠른 선택</span><div>{vehicleOptions.filter((name) => !manual.vehicle_number.trim() || name.toLowerCase().includes(manual.vehicle_number.trim().toLowerCase())).slice(0, 18).map((name) => <button type="button" key={name} onClick={() => applyVehicleProfile(name)}>{name}</button>)}</div><small>기존 명세서에서 불러온 번호를 누르면 최근 현장·유종·단가·주유처가 자동 입력됩니다.</small></div>}
      <div className="fuel-manual-total"><span>예상 합계</span>''',
              'quick vehicle buttons')

          p.write_text(s)
          PY
          cat >> src/features/fuel/fuelManagement.css <<'CSS'
          .fuel-quick-vehicles{margin:12px 0 4px;padding:12px;border:1px solid #dbe5f1;border-radius:12px;background:#f8fbff}.fuel-quick-vehicles>span{display:block;font-weight:700;margin-bottom:8px}.fuel-quick-vehicles>div{display:flex;flex-wrap:wrap;gap:6px}.fuel-quick-vehicles button{border:1px solid #cbd8e8;background:#fff;border-radius:999px;padding:6px 10px;cursor:pointer}.fuel-quick-vehicles button:hover{border-color:#2563eb;color:#1d4ed8}.fuel-quick-vehicles small{display:block;margin-top:8px;color:#64748b}.fuel-head-actions{flex-wrap:wrap}
          CSS
      - name: Build
        run: npm ci && npm run build
      - name: Commit enhancement
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/fuel/FuelManagement.tsx src/features/fuel/fuelManagement.css
          git commit -m "feat: add fuel exports and quick vehicle entry"
          git push origin HEAD:feat/fuel-download-quick-entry-20260914
