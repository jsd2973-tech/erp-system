name: Verify dispatch selective loading

on:
  push:
    branches:
      - fix/priority5-auth-bid-date

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/priority5-auth-bid-date

      - name: Apply selective loading and RLS patch
        run: python scripts/fix_dispatch_selective_loading.py

      - name: Install dependencies
        run: npm ci

      - name: TypeScript and build
        run: npm run build

      - name: Verify selective loading guards
        run: |
          grep -q 'const canReadVehicles' src/features/dispatch/DispatchPage.tsx
          grep -q 'canReadMasters ? supabase.from("dispatch_customers")' src/features/dispatch/DispatchPage.tsx
          grep -q '기존 화면 자료와 입력값은 유지됩니다' src/features/dispatch/DispatchPage.tsx
          grep -q '조회 권한 없음' src/features/dispatch/DispatchPage.tsx

      - name: Verify RLS permission matrix
        run: |
          python - <<'PY'
          from pathlib import Path
          s = Path('supabase/dispatch_office_editor_rls_review.sql').read_text(encoding='utf-8')
          for table in ('customers','locations','items'):
              start = s.index(f'create policy dispatch_{table}_staff_insert')
              end = s.index(';', start) + 1
              block = s[start:end]
              assert "dispatch_register" in block and "dispatch_basics" in block, block
              ustart = s.index(f'create policy dispatch_{table}_staff_update')
              uend = s.index(';', ustart) + 1
              ublock = s[ustart:uend]
              assert "dispatch_basics" in ublock and "dispatch_register" not in ublock, ublock
          assert "deleted_at is not null" in s
          assert "guard_dispatch_driver_auth_user_id" in s
          assert "dispatch_drivers_staff_update" in s
          assert "dispatch_admin_users" in s and "일반 직원을 추가하지 않음" in s
          print('static permission matrix checks passed')
          PY

      - name: Verify duplicate-master safeguards
        run: |
          grep -q 'normalizedMasterName(customer.name) === normalizedMasterName(vendorName)' src/features/dispatch/DispatchPage.tsx
          grep -q 'normalizedMasterName(item.name) === normalizedMasterName(itemName)' src/features/dispatch/DispatchPage.tsx
          grep -q 'customerError.code === "23505"' src/features/dispatch/DispatchPage.tsx
          grep -q 'itemError.code === "23505"' src/features/dispatch/DispatchPage.tsx

      - name: Commit verified changes
        run: |
          if git diff --quiet -- src/features/dispatch/DispatchPage.tsx supabase/dispatch_office_editor_rls_review.sql; then
            echo "No source changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/dispatch/DispatchPage.tsx supabase/dispatch_office_editor_rls_review.sql
          git commit -m "fix: align dispatch loading with granted permissions"
          git push origin HEAD:fix/priority5-auth-bid-date
