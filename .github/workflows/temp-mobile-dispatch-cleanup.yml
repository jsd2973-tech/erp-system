name: Temporary mobile dispatch cleanup
on:
  push:
    branches:
      - fix/mobile-dispatch-results-order-20260914
permissions:
  contents: write
jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/mobile-dispatch-results-order-20260914
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Remove duplicate admin-only mobile vehicle group
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          app = Path('src/App.tsx')
          text = app.read_text()
          pattern = re.compile(r'\s*\{\(isAdmin \|\| isAdmin \|\| isAdmin\) && <details className="mobile-menu-group" open><summary><Truck size=\{16\} aria-hidden="true" />차량·기사</summary><div className="mobile-menu-items">.*?</div></details>\}', re.S)
          text, count = pattern.subn('', text, count=1)
          if count != 1:
              raise SystemExit(f'duplicate mobile vehicle group not found: {count}')
          app.write_text(text)
          PY
      - name: Build
        run: npm ci && npm run build
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx
          git commit -m "fix: remove duplicate mobile dispatch group"
          git push origin HEAD:fix/mobile-dispatch-results-order-20260914
