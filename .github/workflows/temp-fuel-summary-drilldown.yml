name: Temp fuel summary drilldown
on:
  push:
    branches:
      - feat/fuel-summary-drilldown-20260914
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/fuel-summary-drilldown-20260914
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply changes
        run: python3 scripts/fuel_summary_drilldown.py
      - name: Build
        run: npm ci && npm run build
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/fuel/FuelManagement.tsx src/features/fuel/fuelManagement.css
          git commit -m "feat: add fuel vehicle and site drilldowns [skip ci]"
          git push origin HEAD:feat/fuel-summary-drilldown-20260914
