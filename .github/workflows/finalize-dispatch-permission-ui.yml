name: Finalize dispatch permission UI

on:
  push:
    branches:
      - fix/priority5-auth-bid-date
    paths:
      - .github/workflows/finalize-dispatch-permission-ui.yml

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/priority5-auth-bid-date
          fetch-depth: 0
      - name: Apply final permission UI patch
        run: python scripts/finalize_dispatch_permission_ui.py
      - name: Install dependencies
        run: npm ci
      - name: TypeScript and build
        run: npm run build
      - name: Verify permission behavior
        run: |
          grep -q 'permissions: target.permissions || {}' src/App.tsx
          grep -q '사무실 기본 권한' src/App.tsx
          grep -q 'label: "운행관리"' src/App.tsx
          grep -q '운행관리 ${DISPATCH_VIEWS.filter' src/App.tsx
      - name: Commit verified source change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx
          git commit -m "fix: allow dispatch permissions for office users"
          git push origin HEAD:fix/priority5-auth-bid-date
