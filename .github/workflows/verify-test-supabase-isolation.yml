name: Verify isolated Supabase test target

on:
  push:
    branches:
      - fix/priority5-auth-bid-date

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/priority5-auth-bid-date
      - name: Apply test admin email patch
        run: python scripts/enable_test_admin_email.py
      - name: Install dependencies
        run: npm ci
      - name: TypeScript and build
        run: npm run build
      - name: Verify test Supabase isolation guards
        run: |
          grep -q 'VITE_SUPABASE_TEST_MODE' src/supabaseClient.ts
          grep -q 'VITE_SUPABASE_URL' src/supabaseClient.ts
          grep -q 'VITE_SUPABASE_ANON_KEY' src/supabaseClient.ts
          grep -q 'VITE_TEST_ADMIN_EMAIL' src/App.tsx
          grep -q 'dispatch_phase1.sql' supabase/TEST_DISPATCH_SETUP.md
          grep -q 'dispatch_office_editor_rls_review.sql' supabase/TEST_DISPATCH_SETUP.md
      - name: Commit verified App change
        run: |
          if git diff --quiet -- src/App.tsx; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx
          git commit -m "test: support synthetic admin in isolated Supabase"
          git push origin HEAD:fix/priority5-auth-bid-date
