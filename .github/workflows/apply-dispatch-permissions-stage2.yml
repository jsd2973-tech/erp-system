name: Apply dispatch permissions and stage2

on:
  push:
    branches:
      - fix/priority5-auth-bid-date
    paths:
      - .github/workflows/apply-dispatch-permissions-stage2.yml

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/priority5-auth-bid-date
          fetch-depth: 0
      - name: Inspect DispatchPage call
        run: grep -n -A8 -B4 'DispatchPage' src/App.tsx | tail -30
      - name: Apply source patch
        run: python scripts/apply_dispatch_permissions_stage2.py
      - name: Install dependencies
        run: npm ci
      - name: TypeScript and build
        run: npm run build
      - name: Verify permission and stage2 guards
        run: |
          grep -q 'key: "dispatch_vehicles", label: "운행관리 · 차량관리"' src/App.tsx
          grep -q 'DISPATCH_VIEWS.includes(tab as DispatchView)' src/App.tsx
          grep -q 'allowedViews={DISPATCH_VIEWS.filter' src/App.tsx
          grep -q 'filter((key) => allowedViews.includes(key))' src/features/dispatch/DispatchPage.tsx
          grep -q 'onDelete={isAdmin ? deleteOrder : undefined}' src/features/dispatch/DispatchPage.tsx
          grep -q '미완료 운행 계속' src/features/dispatch/DriverMobileApp.tsx
      - name: Commit verified source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx src/features/dispatch/DispatchPage.tsx src/features/dispatch/DispatchList.tsx src/features/dispatch/DispatchDetail.tsx src/features/dispatch/DriverMobileApp.tsx
          git commit -m "fix: add dispatch permissions and harden driver trip flow"
          git push origin HEAD:fix/priority5-auth-bid-date
