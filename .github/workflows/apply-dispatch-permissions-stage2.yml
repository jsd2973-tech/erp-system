name: Apply dispatch permissions and stage2

on:
  push:
    branches:
      - fix/priority5-auth-bid-date
    paths:
      - .github/workflows/apply-dispatch-permissions-stage2.yml

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/priority5-auth-bid-date
          fetch-depth: 0
      - name: Patch DispatchPage render gate
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/App.tsx')
          s = p.read_text(encoding='utf-8')
          s = s.replace('{isAdmin && DISPATCH_VIEWS.includes(menuTab as DispatchView) && (', '{DISPATCH_VIEWS.includes(menuTab as DispatchView) && canAccessTab(menuTab) && (', 1)
          if 'allowedViews={DISPATCH_VIEWS.filter((dispatchView) => canAccessTab(dispatchView))}' not in s:
              s = s.replace('            isAdmin={isAdmin}\n            onNavigate=', '            isAdmin={isAdmin}\n            allowedViews={DISPATCH_VIEWS.filter((dispatchView) => canAccessTab(dispatchView))}\n            onNavigate=', 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Apply source patch
        run: python scripts/apply_dispatch_permissions_stage2.py
      - name: Fix readonly dispatch view helper type
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/App.tsx')
          s = p.read_text(encoding='utf-8')
          s = s.replace('const canShowAny = (tabs: string[]) =>', 'const canShowAny = (tabs: readonly string[]) =>', 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Install dependencies
        run: npm ci
      - name: TypeScript and build
        run: npm run build
      - name: Verify permission and stage2 guards
        run: |
          grep -q 'key: "dispatch_vehicles", label: "운행관리 · 차량관리"' src/App.tsx
          grep -q 'DISPATCH_VIEWS.includes(tab as DispatchView)' src/App.tsx
          grep -q 'allowedViews={DISPATCH_VIEWS.filter' src/App.tsx
          grep -q 'filter((key) => allowedViews.includes(key))' src/features/dispatch/DispatchPage.tsx
          grep -q 'onDelete={isAdmin ? deleteOrder : undefined}' src/features/dispatch/DispatchPage.tsx
          grep -q '미완료 운행 계속' src/features/dispatch/DriverMobileApp.tsx
      - name: Commit verified source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx src/features/dispatch/DispatchPage.tsx src/features/dispatch/DispatchList.tsx src/features/dispatch/DispatchDetail.tsx src/features/dispatch/DriverMobileApp.tsx
          git commit -m "fix: add dispatch permissions and harden driver trip flow"
          git push origin HEAD:fix/priority5-auth-bid-date
