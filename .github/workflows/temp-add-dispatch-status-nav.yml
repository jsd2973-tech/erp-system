name: One-time dispatch status nav patch

on:
  push:
    branches:
      - feat/dispatch-trash
    paths:
      - .github/workflows/temp-add-dispatch-status-nav.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/dispatch-trash
          fetch-depth: 0
      - name: Add 운행현황 to desktop and mobile navigation
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('src/App.tsx')
          s = p.read_text(encoding='utf-8')

          if 'menuButton("dispatch_status", "운행현황")' not in s:
              pattern = r'(?P<indent>^[ \t]*)\{menuButton\("dispatch_list", "배차목록"\)\}[ \t]*$'
              replacement = lambda m: m.group(0) + '\n' + m.group('indent') + '{menuButton("dispatch_status", "운행현황")}'
              s, count = re.subn(pattern, replacement, s, count=1, flags=re.MULTILINE)
              if count != 1:
                  raise SystemExit('desktop 배차목록 menu line not found')

          if 'setMenuTab("dispatch_status")' not in s:
              pattern = r'(?P<indent>^[ \t]*)\{isAdmin && <button onClick=\{\(\) => \{ setMenuTab\("dispatch_list"\); setMobileSheet\(""\); \}\}>배차목록</button>\}[ \t]*$'
              replacement = lambda m: m.group(0) + '\n' + m.group('indent') + '{isAdmin && <button onClick={() => { setMenuTab("dispatch_status"); setMobileSheet(""); }}>운행현황</button>}'
              s, count = re.subn(pattern, replacement, s, count=1, flags=re.MULTILINE)
              if count != 1:
                  raise SystemExit('mobile 배차목록 menu line not found')

          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit navigation fix
        run: |
          if git diff --quiet -- src/App.tsx; then
            echo "No change needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx
          git commit -m "fix: expose dispatch status in app navigation"
          git push origin HEAD:feat/dispatch-trash
