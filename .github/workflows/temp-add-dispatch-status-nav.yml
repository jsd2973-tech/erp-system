name: One-time dispatch status nav patch

on:
  push:
    branches:
      - feat/dispatch-trash
    paths:
      - .github/workflows/temp-add-dispatch-status-nav.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/dispatch-trash
          fetch-depth: 0
      - name: Add 운행현황 to desktop and mobile navigation
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/App.tsx')
          s = p.read_text(encoding='utf-8')
          desktop_old = '''                {menuButton("dispatch_register", "배차등록")}
                {menuButton("dispatch_list", "배차목록")}
                {menuButton("dispatch_vehicles", "차량관리")}'''
          desktop_new = '''                {menuButton("dispatch_register", "배차등록")}
                {menuButton("dispatch_list", "배차목록")}
                {menuButton("dispatch_status", "운행현황")}
                {menuButton("dispatch_vehicles", "차량관리")}'''
          mobile_old = '''                  {isAdmin && <button onClick={() => { setMenuTab("dispatch_register"); setMobileSheet(""); }}>배차등록</button>}
                  {isAdmin && <button onClick={() => { setMenuTab("dispatch_list"); setMobileSheet(""); }}>배차목록</button>}
                  {isAdmin && <button onClick={() => { setMenuTab("dispatch_vehicles"); setMobileSheet(""); }}>차량관리</button>}'''
          mobile_new = '''                  {isAdmin && <button onClick={() => { setMenuTab("dispatch_register"); setMobileSheet(""); }}>배차등록</button>}
                  {isAdmin && <button onClick={() => { setMenuTab("dispatch_list"); setMobileSheet(""); }}>배차목록</button>}
                  {isAdmin && <button onClick={() => { setMenuTab("dispatch_status"); setMobileSheet(""); }}>운행현황</button>}
                  {isAdmin && <button onClick={() => { setMenuTab("dispatch_vehicles"); setMobileSheet(""); }}>차량관리</button>}'''
          if 'menuButton("dispatch_status", "운행현황")' not in s:
              if desktop_old not in s:
                  raise SystemExit('desktop navigation pattern not found')
              s = s.replace(desktop_old, desktop_new, 1)
          if 'setMenuTab("dispatch_status")' not in s:
              if mobile_old not in s:
                  raise SystemExit('mobile navigation pattern not found')
              s = s.replace(mobile_old, mobile_new, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit navigation fix
        run: |
          if git diff --quiet -- src/App.tsx; then
            echo "No change needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx
          git commit -m "fix: expose dispatch status in app navigation"
          git push origin HEAD:feat/dispatch-trash
