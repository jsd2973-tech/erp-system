name: temp-fuel-record-edit
on:
  push:
    branches: [fix/fuel-record-edit-20260914]
permissions:
  contents: write
jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/fuel-record-edit-20260914
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply changes
        run: python3 scripts/add_fuel_record_edit.py
      - name: Build
        run: npm ci && npm run build
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/fuel/FuelManagement.tsx src/features/fuel/fuelManagement.css
          git commit -m "feat: add fuel record editing [skip ci]" || true
          git push origin fix/fuel-record-edit-20260914
